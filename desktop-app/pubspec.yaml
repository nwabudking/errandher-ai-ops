name: errandher_ai_ops_desktop
description: >
  ErrandHer AI Operating System — founder's desktop command centre.
  Phase 1: a Ping Check tab (the Phase 0 round-trip proof) and an
  Approvals tab — list, approve, and reject AI-proposed actions directly
  against the Laravel AI-Ops API, no Claude Code involved in that path.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
