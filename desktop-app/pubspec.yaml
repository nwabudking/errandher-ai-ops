name: errandher_ai_ops_desktop
description: >
  ErrandHer AI Operating System — founder's desktop command centre.
  Phase 0: proves the round trip (button -> shell out to Claude Code ->
  MCP tool call -> Laravel AI-Ops API -> result shown here) before any
  real department tooling is added.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
